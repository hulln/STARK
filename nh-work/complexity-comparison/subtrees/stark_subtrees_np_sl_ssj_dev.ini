[settings]

# Subtree-level complexity run: unlike the whole-sentence verification
# (head = deprel=root), this extracts SHORTER trees — noun phrases headed by
# a NOUN — to confirm the complexity measures compute on sub-sentential trees.

input = nh-work/complexity-comparison/data/sl_ssj-ud-dev.UD-Slovenian-SSJ-212197d.conllu
output = nh-work/complexity-comparison/subtrees/outputs/stark_subtrees_np_sl_ssj_dev.tsv

node_type = upos
labeled = yes
label_subtypes = no
fixed = yes

size = 2-6
head = upos=NOUN

association_measures = no
complexity_measures = yes

example = yes
grew_match = no
depsearch = no
node_info = no
head_info = yes

greedy_counter = yes
complete = yes
