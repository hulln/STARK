[settings]

# Base config for the relation-defined subtree corroboration. The `head` and
# `output` lines are overridden per relation on the command line, e.g.:
#
#   python3 stark.py --config_file <this file> \
#     --head deprel=advcl \
#     --output nh-work/complexity-comparison/subtrees-by-relation/outputs/stark_advcl_dev.tsv
#
# Only `head` changes between relations (advcl / acl / conj) — same tool, same
# data, same every other setting. STARK is not modified.

input = nh-work/complexity-comparison/data/sl_ssj-ud-dev.UD-Slovenian-SSJ-212197d.conllu
output = nh-work/complexity-comparison/subtrees-by-relation/outputs/stark_advcl_dev.tsv

node_type = upos
labeled = yes
label_subtypes = no
fixed = yes

size = 2-12
head = deprel=advcl

association_measures = no
complexity_measures = yes

example = yes
grew_match = no
depsearch = no
node_info = no
head_info = yes

greedy_counter = yes
complete = yes
